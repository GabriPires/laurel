[package]
name = "laurel-engine"
version = "0.1.0-rc.14"
description = "Laurel headless recording engine (PoC-E1): capture, replay buffer, screenshots and multi-track audio on top of libobs."
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
png = "0.17"
serde_json = "1"
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }
