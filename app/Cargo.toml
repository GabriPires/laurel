[package]
name = "laurel-app"
version = "0.1.0-rc.18"
description = "Laurel desktop app (PoC-U1): tray, windows, hotkeys and supervision of laurel-engine."
edition.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
laurel-app-core = { path = "core" }
laurel-app-win = { path = "win" }
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
serde_json = "1"
tauri-plugin-updater = "2"
