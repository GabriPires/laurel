[package]
name = "laurel-app-core"
# An internal library built into laurel-app; its version is not released on its own.
version = "0.0.0"
description = "Laurel app's logic that needs neither Windows nor Tauri, so that it can be tested on any platform."
edition.workspace = true
license.workspace = true
publish = false

# Tests live only in tests/ (decision D14); a code block in a doc comment is an
# example, not a test.
[lib]
doctest = false

[dependencies]
serde_json = "1"
# The library index; SQLite is built into the program (and into the test programs),
# so nothing has to be installed.
rusqlite = { version = "0.32", features = ["bundled"] }
# The .zip of logs to send (log.rs).
flate2 = "1"
crc32fast = "1"
# Custom tags' names compared without accents (library/tags.rs).
unicode-normalization = "0.1"

[dev-dependencies]
proptest = "1"
