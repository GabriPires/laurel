[package]
name = "gpu-test-game"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Test fixture: a Direct3D 11 window filled with one color, on a chosen adapter (a GPU or WARP), to test game capture across GPUs without a real game (A13 of the stability tests)."
publish = false

[dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
debug = "line-tables-only"
